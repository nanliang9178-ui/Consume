<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF5A1F" />
    <title>扫码点单 · 天枢点单</title>
    <noscript><meta http-equiv="refresh" content="0; url=/Consume/" /></noscript>
  </head>
  <body>
    <div id="root">
      <div style="font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #6f625a; padding: 48px 24px; text-align: center;">
        正在加载「扫码点单 · 天枢点单」…
      </div>
    </div>
    <script>
      /*
       * GitHub Pages 的 404 兜底：单页应用的深层链接（如 /Consume/demo）由本页
       * 动态加载对应外壳脚本，路径必须写绝对路径，因为 404 页可能出现在任意深度。
       */
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (p !== '/Consume' && p.indexOf('/Consume/') !== 0) {
          location.replace('/Consume/');
          return;
        }

        var cfg = {
          title: '扫码点单 · 天枢点单',
          icon: '/Consume/favicon.svg',
          css: '/Consume/assets/h5-app.css',
          mocks: [
                '/Consume/assets/mqtt.min.js',
                '/Consume/assets/live-sync.js',
                '/Consume/assets/mock-core.js',
                '/Consume/assets/mock-h5.js'
          ],
          app: '/Consume/assets/h5-app.js',
        };

        document.title = cfg.title;

        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/svg+xml';
        icon.href = cfg.icon;
        document.head.appendChild(icon);

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.crossOrigin = 'anonymous';
        css.href = cfg.css;
        document.head.appendChild(css);

        var index = 0;

        function loadScript(src, done) {
          var script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = done;
          script.onerror = function () {
            console.error('[tianshu-demo] 脚本加载失败：' + src);
            done();
          };
          document.body.appendChild(script);
        }

        function loadApp() {
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = cfg.app;
          document.body.appendChild(script);
        }

        function next() {
          if (index < cfg.mocks.length) {
            loadScript(cfg.mocks[index++], next);
            return;
          }
          loadApp();
        }

        next();
      })();
    </script>
  </body>
</html>
